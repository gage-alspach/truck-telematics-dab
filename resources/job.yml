resources:
  jobs:
    telematics_orchestrator:
      name: ${var.job_name}
      max_concurrent_runs: 1

      parameters:
        - name: drift_mode
          default: none
        - name: batches
          default: ${var.generator_batches}

      # Serverless job compute: Python tasks use an environment_key and this job
      # intentionally defines no new_cluster, job_clusters, or existing_cluster_id.
      environments:
        - environment_key: default
          spec:
            environment_version: '4'

      tasks:
        - task_key: generate_pings
          spark_python_task:
            python_file: ../src/jobs/generate_pings.py
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
              - --volume
              - ${var.landing_volume}
              - --batches
              - '{{job.parameters.batches}}'
              - --sleep-seconds
              - ${var.generator_sleep_seconds}
              - --drift-mode
              - '{{job.parameters.drift_mode}}'
          environment_key: default

        - task_key: refresh_pipeline
          depends_on:
            - task_key: generate_pings
          pipeline_task:
            pipeline_id: ${resources.pipelines.telematics_pipeline.id}
          # Auto Loader addNewColumns updates schema metadata and can require a retry.
          max_retries: 2
          min_retry_interval_millis: 10000
